name: PMN-001 (k) Linked PR Fix-Up

# Auto-substitutes canonical placeholder patterns in files changed by a
# squash-merged PR, then opens a chore-fix-up PR with the substitutions.
# Replaces the manual PMN-001 (k) chore-fix-up cycle.
#
# Substitutions applied (frontmatter only):
#   linked_pr: PR-N (Builder fills with squash SHA post-merge per PMN-001 (k))
#     -> linked_pr: PR-N (squash SHA <7-char-sha>)
#   status: drafted -> status: recorded
#   status: active  -> status: resolved
#
# Failure modes degrade to "manual fallback works as today" — the Action is
# additive, not load-bearing. If it fails to fire or no-ops unexpectedly,
# owner runs the manual chore-fix-up cycle.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  linked-pr-fix-up:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Recursion guard — skip if source branch is itself a fix-up
        id: recursion-guard
        run: |
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ "$SOURCE_BRANCH" =~ ^chore/task-[0-9]+-(linked-pr-fix-up|pmn-001-k)$ ]]; then
            echo "Recursion guard: source=${SOURCE_BRANCH} matches fix-up pattern; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout merged commit with full history
        if: steps.recursion-guard.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Identify files changed in squash-merge
        if: steps.recursion-guard.outputs.skip == 'false'
        id: changed-files
        run: |
          SQUASH_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          if ! git cat-file -e "${SQUASH_SHA}" 2>/dev/null; then
            echo "::warning::Squash SHA ${SQUASH_SHA} not reachable on main; skipping"
            {
              echo "files<<EOF"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${SQUASH_SHA}^" "${SQUASH_SHA}")
          echo "Files changed in squash:"
          echo "${CHANGED}"
          {
            echo "files<<EOF"
            echo "${CHANGED}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply placeholder substitutions
        if: steps.recursion-guard.outputs.skip == 'false'
        id: substitute
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SQUASH_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          python3 .github/scripts/linked-pr-fix-up.py

      - name: Open chore-fix-up PR if substitutions were applied
        if: steps.recursion-guard.outputs.skip == 'false' && steps.substitute.outputs.changes-applied == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SQUASH_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          # Parse task-NNNN from parent branch name
          TASK_TOKEN=$(echo "${SOURCE_BRANCH}" | grep -oE 'task-[0-9]+' | head -1 || true)
          if [[ -z "${TASK_TOKEN}" ]]; then
            echo "::error::Could not parse task-NNNN from parent branch ${SOURCE_BRANCH}"
            exit 1
          fi

          BRANCH_NAME="chore/${TASK_TOKEN}-linked-pr-fix-up"
          SHORT_SHA="${SQUASH_SHA:0:7}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH_NAME}"
          git add -A
          git commit \
            -m "chore(amas): ${TASK_TOKEN} linked PR fix-up — substitute PR-${PR_NUMBER} squash SHA per PMN-001 (k)" \
            -m "Auto-generated by .github/workflows/linked-pr-fix-up.yml." \
            -m "Parent PR: #${PR_NUMBER} (squash SHA ${SHORT_SHA})."

          git push -u origin "${BRANCH_NAME}"

          BODY_FILE="$(mktemp)"
          cat > "${BODY_FILE}" <<EOF
          Auto-generated by \`.github/workflows/linked-pr-fix-up.yml\` per PMN-001 (k) Linked PR fix-up substitution mechanism.

          ## Substitutions applied

          Files changed by parent PR #${PR_NUMBER} (squash SHA \`${SHORT_SHA}\`) were scanned for canonical placeholder patterns. Substitutions in YAML frontmatter only:

          - \`linked_pr: PR-N (Builder fills with squash SHA post-merge per PMN-001 (k))\` → \`linked_pr: PR-N (squash SHA <sha>)\`
          - \`status: drafted\` → \`status: recorded\` (PMN + canonical-content artifacts)
          - \`status: active\` → \`status: resolved\` (TASK handoffs)

          ## Owner action

          Squash-merge this PR per ADR-001 decision 9 admin-bypass posture (per github-reference.md §3.2 single-contributor governance) once Codex auto-review fires, or invoke \`@codex review\` if not.

          ## Failure mode reference

          If this PR is incorrect or incomplete, the manual PMN-001 (k) chore-fix-up cycle continues to work — close this PR and run the manual cycle. The Action is additive, not load-bearing.
          EOF

          gh pr create \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "chore(amas): ${TASK_TOKEN} linked PR fix-up — substitute PR-${PR_NUMBER} squash SHA" \
            --body-file "${BODY_FILE}"

          rm -f "${BODY_FILE}"

      - name: Report no-op if no substitutions applied
        if: steps.recursion-guard.outputs.skip == 'false' && steps.substitute.outputs.changes-applied != 'true'
        run: |
          echo "No canonical placeholder patterns found in PR #${{ github.event.pull_request.number }}'s changed files."
          echo "No chore-fix-up PR opened."
