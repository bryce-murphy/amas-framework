# Surfaces manifest template
#
# Canonical template form for AMAS project surfaces manifests per github-reference.md §7
# (surfaces-manifest reservation). A surfaces manifest enumerates the receiving-surface files
# (per-agent operating-frame markdown such as AGENTS.md, CLAUDE.md, .cursorrules, etc.) that
# materialize AMAS canonical content for different AI agents in the project's tool inventory.
#
# Filled instances live at `.amas/surfaces.yml` (single canonical file per project; not enumerated).
# Template form-of-record at framework-package level: templates/surfaces-manifest-template.yml.
#
# Status: filled
# Filled by: PR-48 (TASK-0033)
# Template version: 3.0.0

# Schema metadata.
metadata:
  # Canonical project slug matching project-brief project_id (e.g., amas-framework).
  project_id: <project-slug>

  # AMAS canonical version when authored or last amended (e.g., v2.30).
  framework_version: <version>

  # Lifecycle state: active | archived.
  status: active

# Receiving surfaces enumeration.
#
# Each entry describes one receiving-surface file with the agents that read it,
# its repo path, the canonical AMAS version it anchors at, and its lifecycle status.
#
# Receiving surfaces are markdown files placed at the project root or other
# agent-discovered locations that carry per-agent operating-frame guidance derived
# from AMAS canonical content. Per ADR-006 D2 + Batch P7 receiving-surface adapter
# packs (forthcoming): adapter packs codify the canonical translation pattern from
# core.md to per-agent surface format.
surfaces:
  - name: AGENTS.md
    path: AGENTS.md
    agents:
      - <agent-slug>  # canonical agent slug; e.g., codex, claude, cursor
    canonical_version: <version>  # AMAS version anchored at; e.g., v2.30
    status: active  # active | superseded
    notes: <1-line notes for project-specific configuration or constraint>

  - name: CLAUDE.md
    path: CLAUDE.md
    agents:
      - claude
    canonical_version: <version>
    status: active

  # Add additional surface entries as needed per project's receiving-surface posture.
  # Examples: .cursorrules for Cursor IDE; .github/copilot-instructions.md for GitHub
  # Copilot; custom adapter surfaces for specialized tooling.

